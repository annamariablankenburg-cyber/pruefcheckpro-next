name: Firestore Rules Tests

# Testet firestore.rules automatisiert gegen den lokalen Firestore-Emulator
# (siehe docs/firebase/firestore-rules-testing.md). Nur Emulator: keine
# Deployments, keine Secrets, keine Firebase-Credentials, kein echtes Projekt.
on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/**"
      - "tests/config/**"
      - "package.json"
      - "package-lock.json"
      - "src/lib/firebase/collections.ts"
      - "src/config/roles.ts"
      - "src/types/role.ts"
      - "src/lib/roles/**"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/**"
      - "tests/config/**"
      - "package.json"
      - "package-lock.json"
      - "src/lib/firebase/collections.ts"
      - "src/config/roles.ts"
      - "src/types/role.ts"
      - "src/lib/roles/**"
      - ".github/workflows/firestore-rules.yml"

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Der Firestore-Emulator braucht Java (firebase-tools 15.x: mindestens 21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # Konfig-Invarianten der Permission-Taxonomie (kein Emulator nötig).
      - run: npm run test:permissions

      # Startet den Emulator über `firebase emulators:exec`, führt die Tests aus
      # und beendet den Emulator wieder.
      - run: npm run test:rules
